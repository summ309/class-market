<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리반 학급마켓</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

:root{
  --bg:#FBF3E1;
  --card:#FFFFFF;
  --ink:#3A2E22;
  --ink-soft:#9C8B70;
  --line:#F0E4C9;
  --mint:#4CAF8E; --mint-dark:#337A61; --mint-pale:#DFF3EA;
  --blue:#4C8DFF; --blue-dark:#2F66C9; --blue-pale:#E6EEFF;
  --coin:#F5B942; --coin-dark:#B9791A; --coin-pale:#FDF1D3;
  --pink:#F49AC1; --pink-dark:#D9709E; --pink-pale:#FDEAF2;
  --purple:#B39DDB; --purple-dark:#7E5FC4; --purple-pale:#F1ECFC;
  --orange:#FFB25B; --orange-dark:#D98A2E; --orange-pale:#FFF1DE;
  --coral:#FF6B6B; --coral-dark:#D94F4F;
  --chalk:#2F5B45;
  --radius:20px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{ background:var(--bg); color:var(--ink); font-family:'Noto Sans KR', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
h1,h2,h3,.display{ font-family:'Gaegu','Noto Sans KR',sans-serif; font-weight:700; }
#app{ max-width:1180px; margin:0 auto; padding:20px 16px 60px; }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:10px; font-size:24px; }
.brand .sub{ font-family:'Noto Sans KR',sans-serif; font-size:13px; color:var(--ink-soft); font-weight:500; }
button{ font-family:inherit; cursor:pointer; border:none; border-radius:999px; padding:10px 18px; font-size:15px; font-weight:700; transition:transform .08s ease, box-shadow .15s ease, opacity .15s ease; }
button:active{transform:scale(0.97);}
button:disabled{opacity:.45; cursor:not-allowed; transform:none;}
.btn-primary{background:var(--mint); color:#fff; box-shadow:0 3px 0 var(--mint-dark);}
.btn-primary:hover:not(:disabled){filter:brightness(1.04);}
.btn-blue{background:var(--blue); color:#fff; box-shadow:0 3px 0 var(--blue-dark);}
.btn-purple{background:var(--purple); color:#fff; box-shadow:0 3px 0 var(--purple-dark);}
.btn-coral{background:var(--coral); color:#fff; box-shadow:0 3px 0 var(--coral-dark);}
.btn-ghost{background:transparent; color:var(--ink-soft); box-shadow:none; border:2px solid var(--line); border-radius:12px;}
.btn-small{padding:7px 14px; font-size:13px;}
.btn-block{width:100%; text-align:center;}
.btn-square{border-radius:12px;}

.card{ background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:0 3px 12px rgba(58,46,34,0.07); border:1px solid var(--line); margin-bottom:16px; }

/* ---- role select (home) ---- */
.lang-switch{ display:flex; justify-content:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
.lang-btn{ background:#fff; border:2px solid var(--line); color:var(--ink-soft); padding:7px 14px; border-radius:999px; font-size:13px; font-weight:700; }
.lang-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

.ribbon-wrap{text-align:center; margin-top:10px;}
.ribbon{ display:inline-block; background:var(--mint); color:#fff; font-weight:700; font-size:13px; padding:6px 18px; border-radius:999px; margin-bottom:10px; }
.market-title{ text-align:center; font-size:40px; margin:2px 0 6px; letter-spacing:1px; }
.market-title .c1{color:var(--coin-dark);} .market-title .c2{color:var(--mint-dark);} .market-title .c3{color:var(--blue-dark);} .market-title .c4{color:var(--pink-dark);}
@media (max-width:480px){ .market-title{font-size:30px;} }
.market-sub{text-align:center; color:var(--ink-soft); font-size:14px; margin-bottom:30px;}
.role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; max-width:640px; margin:0 auto; }
@media (max-width:560px){ .role-grid{grid-template-columns:1fr;} }
.role-card{ background:#fff; border-radius:24px; padding:26px 22px; text-align:center; cursor:pointer; transition:transform .12s ease; border:2px solid var(--line); }
.role-card:hover{transform:translateY(-4px);}
.role-card.teacher{border-color:var(--mint);}
.role-card.student{border-color:var(--blue);}
.role-avatar{ width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:48px; margin:0 auto 14px; }
.role-card.teacher .role-avatar{background:var(--mint-pale);}
.role-card.student .role-avatar{background:var(--blue-pale);}
.role-card .rtitle{font-size:20px; font-weight:900; margin-bottom:6px;}
.role-card.teacher .rtitle{color:var(--mint-dark);}
.role-card.student .rtitle{color:var(--blue-dark);}
.role-card .rdesc{font-size:13px; color:var(--ink-soft); margin-bottom:16px;}
.role-card button{width:100%;}
.footer-tag{ text-align:center; margin-top:24px; }
.footer-tag span{ background:var(--card); border:1px solid var(--line); padding:8px 18px; border-radius:999px; font-size:13px; color:var(--ink-soft); }

.field{margin-bottom:12px;}
.field label{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
input[type=text],input[type=number],input[type=password],textarea{
  width:100%; padding:11px 13px; border-radius:12px; border:2px solid var(--line);
  font-size:15px; font-family:inherit; background:#fffdf8;
}
textarea{resize:vertical; min-height:70px;}
input:focus,textarea:focus{outline:none; border-color:var(--mint);}

.err{color:var(--coral-dark); font-size:13px; font-weight:700; margin-top:6px;}
.hint{color:var(--ink-soft); font-size:12.5px; margin-top:4px;}

.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
.tab{ padding:8px 14px; border-radius:999px; font-size:14px; font-weight:700; background:transparent; color:var(--ink-soft); border:2px solid var(--line); }
.tab.active{background:var(--mint); color:#fff; border-color:var(--mint);}

.student-row{ border:1px solid var(--line); border-radius:16px; margin-bottom:10px; padding:12px; }
.student-row .name-line{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.student-row .name{font-weight:700; font-size:16px;}
.coin-pill{ display:inline-flex; align-items:center; gap:4px; background:var(--coin-pale); color:var(--coin-dark); padding:4px 10px; border-radius:999px; font-weight:900; font-size:13.5px; }
.mini-form{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:6px;}
.mini-form .mlabel{font-size:12px; color:var(--ink-soft); font-weight:700; margin-right:2px;}
.mini-form input[type=number]{width:80px;}
.mini-form input[type=text],.mini-form input[type=password]{width:130px;}

.shop-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
.shop-item{ border:1px solid var(--line); border-radius:18px; padding:14px; text-align:center; background:#fffdf8; }
.shop-item .emoji{font-size:40px;}
.shop-item .name{font-weight:700; margin:6px 0 2px;}
.shop-item .price{color:var(--coin-dark); font-weight:900; margin-bottom:4px;}
.shop-item .stock{ display:inline-block; font-size:11.5px; color:var(--mint-dark); background:var(--mint-pale); padding:2px 9px; border-radius:999px; margin-bottom:8px; }
.shop-item .stock.out{color:var(--coral-dark); background:#FDE4E4;}

/* ---- chalkboard hero ---- */
.chalk-hero{ background:var(--chalk); border-radius:24px; padding:26px 22px; text-align:center; color:#fff; margin-bottom:16px; border:4px solid #24493A; position:relative; overflow:hidden; }
.chalk-hero .htitle{ font-size:30px; margin:0 0 6px; }
.chalk-hero .hsub{font-size:13px; opacity:.85;}
.chalk-hero .hbal{ display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.12); padding:8px 18px; border-radius:999px; margin-top:12px; font-family:'Gaegu'; font-size:22px; }
.chalk-hero .hbal.bump{animation:bump .35s ease;}
@keyframes bump{ 0%{transform:scale(1);} 35%{transform:scale(1.18) rotate(-3deg);} 70%{transform:scale(0.96) rotate(2deg);} 100%{transform:scale(1);} }

.passbook{ background:linear-gradient(135deg, var(--mint), var(--mint-dark)); color:#fff; border-radius:22px; padding:26px 22px; margin-bottom:20px; border:3px dashed rgba(255,255,255,0.5); text-align:center; }
.passbook .who{font-size:15px; opacity:.9; font-weight:700;}
.passbook .balance{ font-family:'Gaegu'; font-size:42px; margin:6px 0; display:inline-block; }

.log-item{ display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; flex-wrap:wrap; }
.log-item:last-child{border-bottom:none;}
.log-amt.earn{color:var(--mint-dark); font-weight:900;}
.log-amt.spend{color:var(--coral-dark); font-weight:900;}
.log-amt.deduct{color:var(--coral-dark); font-weight:900;}
.log-amt.save{color:var(--blue); font-weight:900;}
.log-amt.unsave{color:var(--coin-dark); font-weight:900;}
.muted{color:var(--ink-soft); font-size:12.5px;}
.empty{ text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:14px; }

/* ---- student app shell ---- */
.app-shell{ display:flex; gap:16px; align-items:flex-start; }
.side-nav{ width:216px; flex-shrink:0; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 14px; position:sticky; top:16px; }
.profile-box{ text-align:center; padding-bottom:16px; margin-bottom:14px; border-bottom:1px solid var(--line); }
.avatar{ width:66px; height:66px; border-radius:50%; background:var(--blue-pale); display:flex; align-items:center; justify-content:center; font-size:34px; margin:0 auto 8px; cursor:pointer; border:3px solid var(--blue); }
.profile-box .greet{font-size:12px; color:var(--ink-soft); font-weight:700;}
.profile-box .pname{font-weight:900; font-size:17px; margin:2px 0 8px;}
.nav-list{display:flex; flex-direction:column; gap:6px;}
.nav-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:14px; font-weight:700; font-size:14px; color:var(--ink-soft); background:transparent; text-align:left; width:100%; border:none; }
.nav-item .ic-circle{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.nav-item.active{ background:var(--mint-pale); color:var(--mint-dark); }
.nav-item[data-tab=home] .ic-circle{background:var(--mint-pale); color:var(--mint-dark);}
.nav-item[data-tab=wallet] .ic-circle{background:var(--coin-pale); color:var(--coin-dark);}
.nav-item[data-tab=market] .ic-circle{background:var(--orange-pale); color:var(--orange-dark);}
.nav-item[data-tab=spending] .ic-circle{background:var(--purple-pale); color:var(--purple-dark);}
.main-content{flex:1; min-width:0;}
.side-right{ width:230px; flex-shrink:0; position:sticky; top:16px; }
@media (max-width:900px){
  .app-shell{flex-direction:column;}
  .side-nav{width:100%; position:static;}
  .nav-list{flex-direction:row; flex-wrap:wrap;}
  .nav-item{width:auto;}
  .side-right{width:100%; position:static;}
}

.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
@media (max-width:700px){ .stat-grid{grid-template-columns:1fr 1fr;} }
.stat-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 10px; text-align:center; }
.stat-card .sicon{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:21px; margin:0 auto 8px; }
.stat-card.earn .sicon{background:var(--mint-pale); color:var(--mint-dark);}
.stat-card.spend .sicon{background:var(--blue-pale); color:var(--blue-dark);}
.stat-card.save .sicon{background:var(--purple-pale); color:var(--purple-dark);}
.stat-card.total .sicon{background:var(--orange-pale); color:var(--orange-dark);}
.stat-card .slabel{font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:3px;}
.stat-card .sval{font-family:'Gaegu'; font-size:24px;}

.popular-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px;}
.popular-card{ border:1px solid var(--line); border-radius:16px; padding:12px; text-align:center; position:relative; background:#fffdf8; }
.popular-card .rank{ position:absolute; top:8px; left:8px; width:22px; height:22px; border-radius:50%; background:var(--coin); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:12px; }
.popular-card .pemoji{font-size:34px; margin-top:6px;}
.popular-card .pname{font-weight:700; font-size:13.5px; margin:4px 0 2px;}
.popular-card .pcount{font-size:11.5px; color:var(--ink-soft);}

.mini-panel{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; text-align:center; }
.mini-panel .mtop{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:4px;}
.mini-panel .micon{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px;}
.mini-panel.coin .micon{background:var(--coin-pale); color:var(--coin-dark);}
.mini-panel.save .micon{background:var(--pink-pale); color:var(--pink-dark);}
.mini-panel .mtitle{font-size:12.5px; color:var(--ink-soft); font-weight:700;}
.mini-panel .mval{font-family:'Gaegu'; font-size:26px; margin:4px 0 10px;}
.mini-panel.coin .mval{color:var(--coin-dark);}
.mini-panel.save .mval{color:var(--pink-dark);}
.mini-panel button{width:100%;}

.notice-box{ background:var(--chalk); color:#fff; border-radius:18px; padding:16px; margin-bottom:14px; }
.notice-box .ntitle{font-weight:900; font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.notice-box ul{margin:0; padding-left:18px; font-size:12.5px; line-height:1.6;}
.notice-box .empty2{font-size:12.5px; opacity:.75;}

.tip-box{ background:var(--orange-pale); border:1px solid #F6D9A8; border-radius:18px; padding:14px 16px; margin-bottom:14px; }
.tip-box .ttitle{font-weight:900; font-size:13px; color:var(--orange-dark); margin-bottom:4px;}
.tip-box .ttext{font-size:12.5px; color:var(--ink); line-height:1.5;}

.home-bottom-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:16px; }
.home-bottom-row .mini-panel, .home-bottom-row .notice-box, .home-bottom-row .tip-box{ margin-bottom:0; height:100%; }
@media (max-width:800px){ .home-bottom-row{grid-template-columns:1fr;} }

.progress-outer{ width:100%; height:14px; background:var(--pink-pale); border-radius:999px; overflow:hidden; margin:8px 0; }
.progress-inner{ height:100%; background:linear-gradient(90deg, var(--pink), var(--purple)); border-radius:999px; transition:width .3s ease; }

.ledger-table{width:100%; border-collapse:collapse; font-size:13px;}
.ledger-table th{ text-align:left; font-size:12px; color:var(--ink-soft); padding:8px 6px; border-bottom:2px solid var(--line); }
.ledger-table td{ padding:9px 6px; border-bottom:1px solid var(--line); }
.badge{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:900; }
.badge.earn{background:var(--mint-pale); color:var(--mint-dark);}
.badge.spend{background:#FFE3E3; color:var(--coral-dark);}
.badge.deduct{background:#FFE3E3; color:var(--coral-dark);}
.badge.save{background:var(--purple-pale); color:var(--purple-dark);}
.badge.unsave{background:var(--coin-pale); color:var(--coin-dark);}
.badge.cancelled{background:#EDEDED; color:#888;}

.login-wrap{max-width:360px; margin:20px auto 0;}
</style>
</head>

  function uid_(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function fmtTime(ts){ return new Date(ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  function fmtDate(ts){ return new Date(ts).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'}); }

  function findShop(id){ return state.shop.find(s=>s.id===id); }

  function todaysTip(){ const dayIdx = Math.floor(Date.now()/86400000); return TIPS[dayIdx % TIPS.length]; }

  // ---------- 실시간 데이터 연결 ----------
  let unsubs=[];
  function detach(){ unsubs.forEach(f=>{ try{f();}catch(e){} }); unsubs=[]; }
  function listen(path, cb){
    const ref=db.ref(path);
    const h=ref.on('value', snap=>{ cb(snap); softRender(); }, err=>console.error('읽기 거부/실패', path, err && err.code));
    unsubs.push(()=>ref.off('value',h));
  }
  function shopFrom(snap){
    const v=snap.val()||{};
    return Object.keys(v).map(k=>Object.assign({id:k}, v[k])).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  }
  function attachShared(){
    listen('shop', snap=>{ state.shop=shopFrom(snap); });
    listen('notice', snap=>{ state.notice=snap.val()||''; });
  }
  function attachTeacher(){
    attachShared();
    listen('students', snap=>{
      const v=snap.val()||{};
      state.students=Object.keys(v).map(k=>Object.assign({id:k, coins:0, avatar:AVATARS[0]}, v[k])).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    });
    listen('logs', snap=>{
      const v=snap.val()||{}, out=[];
      Object.keys(v).forEach(u=>Object.keys(v[u]||{}).forEach(k=>out.push(Object.assign({id:k, studentId:u}, v[u][k]))));
      out.sort((a,b)=>b.ts-a.ts);
      state.log=out;
    });
  }
  function attachStudent(u){
    attachShared();
    listen('students/'+u, snap=>{
      const v=snap.val();
      state.students = v ? [Object.assign({id:u, coins:0, avatar:AVATARS[0]}, v)] : [];
    });
    listen('logs/'+u, snap=>{
      const v=snap.val()||{};
      state.log=Object.keys(v).map(k=>Object.assign({id:k, studentId:u}, v[k])).sort((a,b)=>b.ts-a.ts);
    });
  }
  function logName(l){ const s=findStudent(l.studentId); return s ? s.name : '(삭제된 학생)'; }

  // ---------- 로그인 상태 처리 ----------
  async function resolveRole(user){
    let tUid=null;
    try{ tUid=(await db.ref('config/teacherUid').once('value')).val(); }catch(e){ console.error(e); }
    const isTeacher = !!tUid && tUid===user.uid;
    if(intent==='teacher' && !isTeacher){ intent=null; state.loginError='이 계정은 선생님 계정이 아니에요.'; await auth.signOut(); return; }
    if(intent==='student' && isTeacher){ intent=null; state.studentLoginError='loginErr'; await auth.signOut(); return; }
    intent=null;
    detach();
    if(isTeacher){
      state.role='teacher'; state.uid=user.uid; state.teacherEmail=user.email||''; state.view='teacher';
      attachTeacher();
    }else{
      let exists=false;
      try{ exists=(await db.ref('students/'+user.uid).once('value')).exists(); }catch(e){}
      if(!exists){ state.studentLoginError='loginErr'; state.view='studentLogin'; await auth.signOut(); return; }
      state.role='student'; state.uid=user.uid; state.currentStudentId=user.uid; state.view='student'; state.studentTab='home';
      attachStudent(user.uid);
    }
    state.authBusy=false;
    render();
  }
  function setupAuthWatcher(){
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
    auth.onAuthStateChanged(async user=>{
      if(suspendAuth) return;
      if(!user){
        detach();
        state.role=null; state.uid=null; state.currentStudentId=null; state.students=[]; state.log=[]; state.shop=[]; state.notice='';
        if(state.view==='teacher'||state.view==='student') state.view='home';
        state.authBusy=false; render(); return;
      }
      await resolveRole(user);
    });
  }

  let pendingRender=false;
  function softRender(){ pendingRender=true; }
  setInterval(()=>{
    if(!pendingRender) return;
    const a=document.activeElement;
    if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA')) return;
    pendingRender=false; render();
  }, 700);

  function authErr(e){
    const c=(e&&e.code)||'';
    if(c.includes('network')) return T('netErr');
    if(c.includes('too-many')) return '시도가 너무 많아요. 잠시 후 다시 해주세요.';
    return null;
  }

  function render(){
    pendingRender=false;
    let html='';
    switch(state.view){
      case 'home': html=viewHome(); break;
      case 'teacherLogin': html=viewTeacherLogin(); break;
      case 'teacher': html=state.role==='teacher' ? viewTeacher() : viewHome(); break;
      case 'studentLogin': html=viewStudentLogin(); break;
      case 'student': html=state.role==='student' ? viewStudent() : viewStudentLogin(); break;
      default: html=viewHome();
    }
    const banner = firebaseOk ? '' : `
      <div style="background:#FDE4E4; border:2px solid var(--coral); color:var(--coral-dark); border-radius:14px; padding:12px 16px; margin-bottom:16px; font-size:13px; font-weight:700;">
        ⚠️ 데이터베이스에 연결하지 못했어요. 인터넷 연결을 확인하거나 Firebase 설정을 확인해주세요.
      </div>`;
    root.innerHTML = banner + html;
  }

  function viewStudent(){
    const s = findStudent(state.currentStudentId);

    const bump = state.prevBalance[s.id]!==undefined && state.prevBalance[s.id]!==s.coins;
    state.prevBalance[s.id] = s.coins;
    let content='';
    if(state.studentTab==='wallet') content=tabWallet(s);

  function tabMarket(s){
    const cards = state.shop.map(it=>{
      const soldOut = !(it.stock===null||it.stock===undefined) && Number(it.stock)<=0;
      const canAfford = s.coins >= it.price;

      const stockText = soldOut ? T('soldOut') : (it.stock===null||it.stock===undefined ? T('unlimitedStock') : T('stockLeft', it.stock));

          <div class="emoji">${esc(it.emoji||'🎁')}</div>

  function tabSpending(s){
    const entries = state.log.filter(l=>l.studentId===s.id).slice().sort((a,b)=>a.ts-b.ts);
    let bal=0;
    const withBal = entries.map(e=>{
      if(!e.cancelled){
        if(e.type==='earn'||e.type==='unsave') bal+=e.amount;
        else if(e.type==='spend'||e.type==='save'||e.type==='deduct') bal-=e.amount;
      }
      return Object.assign({}, e, {balanceAfter: bal});
    }).reverse();
    const typeLabel={earn:T('typeEarn'), spend:T('typeSpend'), deduct:T('typeDeduct')};
    const rows = withBal.map(e=>{
      const sign = (e.type==='earn'||e.type==='unsave') ? '+' : '-';
      const cancelledStyle = e.cancelled ? 'text-decoration:line-through; opacity:.5;' : '';
      return `
      <tr style="${cancelledStyle}"><td>${fmtDate(e.ts)}</td><td>${esc(e.reason||'')}${e.cancelled?` <span class="badge cancelled" style="text-decoration:none;">${esc(T('typeCancelled'))}</span>`:''}</td><td><span class="badge ${e.type}" style="text-decoration:none;">${esc(typeLabel[e.type]||e.type)}</span></td>
      <td style="text-align:right;">${sign}${fmtCoin(e.amount)}</td><td style="text-align:right;">${e.cancelled?'-':fmtCoin(e.balanceAfter)}</td></tr>`;
    }).join('');
    return `<div class="card"><h3 style="margin-top:0;">${esc(T('spendingTitle'))}</h3>
      ${withBal.length ? `<div style="overflow-x:auto;"><table class="ledger-table"><thead><tr><th>${esc(T('colDate'))}</th><th>${esc(T('colContent'))}</th><th>${esc(T('colType'))}</th><th style="text-align:right;">${esc(T('colAmount'))}</th><th style="text-align:right;">${esc(T('colBalance'))}</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty">${esc(T('noRecords'))}</div>`}</div>`;
  }

  async function changeCoins(studentId, delta){
    await db.ref('students/'+studentId+'/coins').transaction(c=>(typeof c==='number'?c:0)+delta);
  }

  async function handleAction(action, target){
    const id = target.getAttribute('data-id');
    if(action==='set-lang'){
      const lang = target.getAttribute('data-lang');
      if(I18N[lang]){ state.lang = lang; try{ localStorage.setItem(K_LANG, lang); }catch(e){} }
      render(); return;
    }
    if(action==='go-teacher-login'){ state.view='teacherLogin'; state.loginError=''; state.busyMsg=''; state.setupMode=false; render(); return; }
    if(action==='go-student-login'){ state.view='studentLogin'; state.studentLoginError=''; render(); return; }
    if(action==='go-home'){ state.view='home'; render(); return; }
    if(action==='toggle-setup'){ state.setupMode=!state.setupMode; state.loginError=''; state.busyMsg=''; render(); return; }
    if(!firebaseOk && (action.includes('login')||action.includes('setup'))){ return; }

    // ----- 선생님 로그인 / 최초 설정 / 비밀번호 찾기 -----
    if(action==='teacher-login'){
      const email=document.getElementById('t-email').value.trim(), pw=document.getElementById('t-pw').value;
      state.teacherEmail=email;
      if(!email||!pw){ state.loginError='이메일과 비밀번호를 입력해주세요.'; render(); return; }
      state.authBusy=true; state.loginError=''; intent='teacher';
      try{ await auth.signInWithEmailAndPassword(email, pw); }
      catch(e){ intent=null; state.authBusy=false; state.loginError=authErr(e)||'이메일 또는 비밀번호가 올바르지 않아요.'; render(); }
      return;
    }
    if(action==='teacher-setup'){
      const email=document.getElementById('t-email').value.trim(), pw=document.getElementById('t-pw').value, pw2=document.getElementById('t-pw2').value;
      state.teacherEmail=email;
      if(!email||!pw){ state.loginError='이메일과 비밀번호를 입력해주세요.'; render(); return; }
      if(pw.length<6){ state.loginError='비밀번호는 6자 이상이어야 해요.'; render(); return; }
      if(pw!==pw2){ state.loginError='비밀번호 확인이 달라요.'; render(); return; }
      state.authBusy=true; state.loginError=''; suspendAuth=true;
      let user=null;
      try{
        const cred=await auth.createUserWithEmailAndPassword(email, pw); user=cred.user;
        await db.ref('config/teacherUid').set(user.uid);   // 아직 아무도 설정하지 않았을 때만 성공해요
      }catch(e){
        state.loginError = (e && e.code==='auth/email-already-in-use') ? '이미 만들어진 계정이에요. 로그인으로 돌아가세요.'
          : (e && /PERMISSION_DENIED/i.test(e.message||'')) ? '이미 선생님 계정이 설정되어 있어요. (다른 사람이 먼저 설정했다면 Firebase 콘솔에서 확인이 필요해요)'
          : (authErr(e) || (e&&e.code==='auth/weak-password' ? '비밀번호가 너무 약해요.' : '계정을 만들지 못했어요.'));
        try{ if(user) await user.delete(); }catch(_){ try{ await auth.signOut(); }catch(__){} }
        suspendAuth=false; state.authBusy=false; render(); return;
      }
      suspendAuth=false; await resolveRole(user); return;
    }
    if(action==='teacher-forgot'){
      const email=document.getElementById('t-email').value.trim();
      if(!email){ state.loginError='위에 이메일을 먼저 입력해주세요.'; render(); return; }
      try{ await auth.sendPasswordResetEmail(email); state.loginError=''; state.busyMsg='비밀번호 재설정 메일을 보냈어요. 메일함을 확인해주세요.'; }
      catch(e){ state.busyMsg=''; state.loginError=authErr(e)||'메일을 보내지 못했어요. 이메일을 확인해주세요.'; }
      render(); return;
    }
    if(action==='teacher-logout'){ state.teacherTab='students'; await auth.signOut(); return; }
    if(action==='teacher-tab'){ state.teacherTab=target.getAttribute('data-tab'); state.confirmDelete=null; state.editingShopId=null; state.savingMsg=''; state.addStudentError=''; state.confirmCancel=null; state.pwChangeError=''; state.pwChangeMsg=''; state.busyMsg=''; render(); return; }

    // ----- 선생님 기능 (서버 규칙이 선생님 계정만 허용해요) -----
    if(state.role==='teacher'){
      if(action==='add-student'){
        const name=document.getElementById('new-student-name').value.trim();
        const pw=document.getElementById('new-student-pw').value.trim();
        if(!name && !pw){ state.addStudentError='이름과 초기 비밀번호를 모두 입력해주세요.'; render(); return; }
        if(!name){ state.addStudentError='이름을 입력해주세요.'; render(); return; }
        if(name.length>20){ state.addStudentError='이름은 20자 이하로 해주세요.'; render(); return; }
        if(!pw){ state.addStudentError='초기 비밀번호를 입력해주세요.'; render(); return; }
        if(pw.length<MIN_PW){ state.addStudentError=`비밀번호는 ${MIN_PW}자 이상이어야 해요.`; render(); return; }
        state.authBusy=true; state.addStudentError=''; state.busyMsg='추가하는 중...'; render();
        try{
          const h=await nameHash(name);
          if((await db.ref('loginIndex/'+h).once('value')).exists()){
            state.addStudentError='이미 같은 이름의 학생이 있어요. 이름을 다르게 구분해주세요 (예: 홍길동1).'; state.busyMsg=''; state.authBusy=false; render(); return;
          }
          const ver=Math.floor(Date.now()/1000), a2=secondaryAuth();
          const cred=await a2.createUserWithEmailAndPassword(stuEmail(h,ver), padPw(pw));
          const nu=cred.user.uid; await a2.signOut();
          await db.ref().update({
            ['students/'+nu]:{name, coins:0, avatar:AVATARS[Math.floor(Math.random()*AVATARS.length)], ver},
            ['loginIndex/'+h]:ver
          });
          state.busyMsg='✅ 추가되었어요.';
        }catch(e){ console.error(e); state.addStudentError=authErr(e)||'학생을 추가하지 못했어요. 다시 시도해주세요.'; state.busyMsg=''; }
        state.authBusy=false; render(); return;
      }
      if(action==='delete-student'){
        if(state.confirmDelete && state.confirmDelete.type==='student' && state.confirmDelete.id===id){
          const s=findStudent(id); state.confirmDelete=null;
          if(s){ try{
            const h=await nameHash(s.name);
            await db.ref().update({['students/'+id]:null, ['logs/'+id]:null, ['loginIndex/'+h]:null});
          }catch(e){ console.error(e); } }
        }else{ state.confirmDelete={type:'student', id}; }
        render(); return;
      }
      if(action==='grant-coin'){
        const type = target.getAttribute('data-type') === 'deduct' ? 'deduct' : 'earn';
        const raw = parseInt(document.getElementById('amt-'+id).value,10);
        if(!raw || raw<=0) return;
        const amt = Math.min(Math.abs(raw), 100000);
        const reason=document.getElementById('reason-'+id).value.trim().slice(0,60);
        const s=findStudent(id); if(!s) return;
        try{
          await changeCoins(id, type==='deduct' ? -amt : amt);
          await db.ref('logs/'+id).push({type, amount:amt, ts:Date.now(), reason: reason || (type==='deduct'?'선생님 차감':'선생님 지급')});
        }catch(e){ console.error(e); }
        render(); return;
      }
      if(action==='cancel-log'){
        if(state.confirmCancel === id){
          const entry = state.log.find(l=>l.id===id);
          state.confirmCancel = null;
          if(entry && !entry.cancelled && (entry.type==='earn'||entry.type==='deduct')){
            try{
              await changeCoins(entry.studentId, entry.type==='earn' ? -entry.amount : entry.amount);
              await db.ref('logs/'+entry.studentId+'/'+id).update({cancelled:true, cancelledAt:Date.now()});
            }catch(e){ console.error(e); }
          }
        }else{ state.confirmCancel = id; }
        render(); return;
      }
      if(action==='reset-student-pw'){
        const pw=document.getElementById('newpw-'+id).value.trim();
        if(pw.length<MIN_PW){ state.savingMsg=''; state.busyMsg=`새 비밀번호는 ${MIN_PW}자 이상이어야 해요.`; render(); return; }
        const s=findStudent(id); if(!s) return;
        state.busyMsg='재설정하는 중...'; render();
        try{
          // 서버 없이는 다른 사람의 비밀번호를 바로 바꿀 수 없어서, 새 계정을 만들고 데이터를 옮겨요.
          const h=await nameHash(s.name), ver=Math.floor(Date.now()/1000), a2=secondaryAuth();
          const oldLogs=(await db.ref('logs/'+id).once('value')).val();
          const cred=await a2.createUserWithEmailAndPassword(stuEmail(h,ver), padPw(pw));
          const nu=cred.user.uid; await a2.signOut();
          const upd={
            ['students/'+nu]:{name:s.name, coins:s.coins||0, avatar:s.avatar||AVATARS[0], ver},
            ['loginIndex/'+h]:ver,
            ['students/'+id]:null, ['logs/'+id]:null
          };
          if(oldLogs) upd['logs/'+nu]=oldLogs;
          await db.ref().update(upd);
          state.busyMsg=`✅ ${s.name} 학생의 비밀번호를 재설정했어요.`;
        }catch(e){ console.error(e); state.busyMsg='재설정하지 못했어요. 다시 시도해주세요.'; }
        render(); return;
      }
      if(action==='save-shop'){
        const emoji=document.getElementById('shop-emoji').value.trim().slice(0,8)||'🎁';
        const name=document.getElementById('shop-name').value.trim().slice(0,40);
        const price=parseInt(document.getElementById('shop-price').value,10);
        const stockRaw=document.getElementById('shop-stock').value;
        const stock=stockRaw===''?null:Math.max(0,parseInt(stockRaw,10)||0);
        if(!name||!price||price<=0) return;
        try{
          if(state.editingShopId){
            await db.ref('shop/'+state.editingShopId).update({emoji,name,price,stock}); state.editingShopId=null;
          }else{
            const o={emoji,name,price,sold:0,createdAt:Date.now()}; if(stock!==null) o.stock=stock;
            await db.ref('shop').push(o);
          }
        }catch(e){ console.error(e); }
        render(); return;
      }
      if(action==='edit-shop'){ state.editingShopId=id; render(); return; }
      if(action==='cancel-edit-shop'){ state.editingShopId=null; render(); return; }
      if(action==='delete-shop'){
        if(state.confirmDelete && state.confirmDelete.type==='shop' && state.confirmDelete.id===id){
          state.confirmDelete=null; try{ await db.ref('shop/'+id).remove(); }catch(e){ console.error(e); }
        }else{ state.confirmDelete={type:'shop', id}; }
        render(); return;
      }
      if(action==='change-teacher-password'){
        const cur=document.getElementById('cur-t-pw').value, next=document.getElementById('new-t-pw').value;
        state.pwChangeMsg=''; state.pwChangeError='';
        if(!cur||!next){ state.pwChangeError='현재 비밀번호와 새 비밀번호를 입력해주세요.'; render(); return; }
        if(next.length<6){ state.pwChangeError='새 비밀번호는 6자 이상이어야 해요.'; render(); return; }
        const u=auth.currentUser;
        try{
          await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, cur));
          await u.updatePassword(next); state.pwChangeMsg='비밀번호가 변경되었어요.';
        }catch(e){ state.pwChangeError=authErr(e)||'현재 비밀번호가 올바르지 않아요.'; }
        render(); return;
      }
      if(action==='save-notice'){
        const text=document.getElementById('notice-text').value.slice(0,1000);
        try{ await db.ref('notice').set(text); state.notice=text; state.savingMsg='공지사항이 저장되었어요.'; }
        catch(e){ state.savingMsg='저장하지 못했어요.'; }
        render(); return;
      }
    }

    // ----- 학생 -----
    if(action==='student-login'){
      const name=document.getElementById('stu-name').value.trim();
      const pw=document.getElementById('stu-pw').value;
      if(!name||!pw) return;
      state.authBusy=true; state.studentLoginError='';
      try{
        const h=await nameHash(name);
        const ver=(await db.ref('loginIndex/'+h).once('value')).val();
        if(ver===null){ state.studentLoginError='loginErr'; state.authBusy=false; render(); return; }
        intent='student';
        await auth.signInWithEmailAndPassword(stuEmail(h,ver), padPw(pw));
      }catch(e){ intent=null; state.authBusy=false; state.studentLoginError = (e&&e.code&&e.code.includes('network')) ? 'netErr' : 'loginErr'; render(); }
      return;
    }
    if(action==='student-logout'){ state.studentTab='home'; await auth.signOut(); state.view='studentLogin'; render(); return; }
    if(action==='student-tab'){ state.studentTab=target.getAttribute('data-tab'); state.pwChangeError=''; state.pwChangeMsg=''; state.buyMsg=''; render(); return; }

    if(state.role==='student'){
      if(action==='change-avatar'){
        const s=findStudent(state.currentStudentId); if(!s) return;
        const idx=AVATARS.indexOf(s.avatar); const next=AVATARS[(idx+1+AVATARS.length)%AVATARS.length];
        try{ await db.ref('students/'+s.id+'/avatar').set(next); }catch(e){ console.error(e); }
        return;
      }
      if(action==='change-own-password'){
        const cur = document.getElementById('cur-pw').value;
        const next = document.getElementById('new-own-pw').value.trim();
        const confirmPw = document.getElementById('confirm-own-pw').value.trim();
        state.pwChangeError=''; state.pwChangeMsg='';
        if(!next){ state.pwChangeError='errNewPwEmpty'; render(); return; }
        if(next.length<MIN_PW){ state.pwChangeError='errPwShort'; render(); return; }
        if(next !== confirmPw){ state.pwChangeError='errPwMismatch'; render(); return; }
        const u=auth.currentUser;
        try{
          await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, padPw(cur)));
          await u.updatePassword(padPw(next));
          state.pwChangeMsg='pwChanged';
        }catch(e){ state.pwChangeError = (e&&e.code&&e.code.includes('network')) ? 'netErr' : 'errCurPw'; }
        render(); return;
      }
      if(action==='buy-item'){
        const s=findStudent(state.currentStudentId), it=findShop(id); if(!s||!it) return;
        const hasStock = it.stock!==null && it.stock!==undefined;
        if((hasStock && Number(it.stock)<=0) || s.coins<it.price){ render(); return; }
        const ts=Date.now(), logKey=db.ref('logs/'+s.id).push().key;
        const upd={};
        upd['students/'+s.id+'/coins']=s.coins-it.price;
        upd['students/'+s.id+'/lastPurchase']={itemId:it.id, ts};
        upd['shop/'+it.id+'/sold']=(it.sold||0)+1;
        if(hasStock) upd['shop/'+it.id+'/stock']=Number(it.stock)-1;
        upd['logs/'+s.id+'/'+logKey]={type:'spend', amount:it.price, ts, reason:`${it.emoji||'🎁'} ${it.name} 구매`, itemId:it.id, itemName:it.name, itemEmoji:it.emoji||'🎁'};
        state.buyMsg='';
        try{ await db.ref().update(upd); }
        catch(e){ console.error('구매 실패', e && e.code); state.buyMsg='buyFail'; }
        render(); return;
      }
    }
  }

  root.addEventListener('click', (e)=>{
    const target=e.target.closest('[data-action]'); if(!target) return;
    handleAction(target.getAttribute('data-action'), target);
  });
  // 엔터키로 로그인
  root.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter') return;
    const id=e.target && e.target.id;
    const map={'t-pw':'teacher-login','t-pw2':'teacher-setup','stu-pw':'student-login'};
    if(id==='t-pw' && state.setupMode) return;
    const act=map[id]; if(act){ const b=root.querySelector(`[data-action="${act}"]`); if(b) b.click(); }
  });

  (function init(){
    try{ const savedLang = localStorage.getItem(K_LANG); if(savedLang && I18N[savedLang]) state.lang = savedLang; }catch(e){}
    render();
    if(firebaseOk) setupAuthWatcher();
  })();
})();
</script>
</body>
</html>
